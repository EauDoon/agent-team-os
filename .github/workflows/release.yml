name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate contract and release tag
        run: python3 scripts/validate.py --release-tag "$GITHUB_REF_NAME"
      - name: Require the tag on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Run rubric cases
        run: python3 evals/runner.py
      - name: Build package
        run: python3 scripts/package.py --output dist
      - name: Verify package against source
        run: python3 scripts/verify_package.py "dist/agent-team-$(python3 scripts/version.py).zip"
      - name: Verify checksum
        run: |
          cd dist
          sha256sum -c "$(ls *.sha256)"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/agent-team-*.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 scripts/version.py)"
          NOTES="docs/release-notes-${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "Release notes file not found: ${NOTES}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "Agent Team ${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes-file "${NOTES}" \
            dist/agent-team-"${VERSION}".zip \
            dist/agent-team-"${VERSION}".zip.sha256
