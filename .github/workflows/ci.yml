name: Contract checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python evals/runner.py
      - run: python scripts/package.py --output dist
      - name: Verify package against source
        shell: bash
        run: python scripts/verify_package.py "dist/agent-team-$(python -c "import pathlib;print(pathlib.Path('VERSION').read_text().strip())").zip"
